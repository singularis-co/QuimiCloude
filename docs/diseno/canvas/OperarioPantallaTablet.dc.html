<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Pantalla del operario · tablet</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./qc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 834px; box-sizing: border-box; font-family: 'IBM Plex Sans', sans-serif">
  <dc-import name="OperarioPantalla" pantalla="{{ pantalla }}" estado="{{ estado }}" oscuro="{{ oscuro }}" alto="{{ 1112 }}" hint-size="834px,1112px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"oscuro":{"editor":"boolean","default":false},"pantalla":{"editor":"enum","options":["Ejecución","Acondicionamiento","Empaque"],"default":"Acondicionamiento"},"estado":{"editor":"enum","options":["Sin comenzar","En curso"],"default":"En curso"},"$preview":{"width":834,"height":1112}}'>
class Component extends DCLogic {
  renderVals() {
    return { pantalla: this.props.pantalla ?? 'Acondicionamiento', estado: this.props.estado ?? 'En curso', oscuro: !!this.props.oscuro };
  }
}
</script>
</body>
</html>
