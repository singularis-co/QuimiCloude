<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Fórmula con pasos de acondicionamiento</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./qc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.sw{display:inline-flex;align-items:center;gap:8px;min-height:36px;padding:0 8px;border:0;border-radius:8px;background:none;color:var(--fg);font:500 13px 'IBM Plex Sans',sans-serif;cursor:pointer;white-space:nowrap}
.sw:hover{background:var(--muted)}
.sw:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.sw-t{position:relative;width:36px;height:20px;flex:none;border-radius:999px;background:var(--input);transition:background-color var(--d-b) var(--e-std)}
.sw-t i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:999px;background:var(--card);box-shadow:0 1px 2px rgb(0 0 0 / .3);transition:translate var(--d-b) var(--e-std)}
.sw[aria-checked="true"] .sw-t{background:var(--primary)}
.sw[aria-checked="true"] .sw-t i{translate:16px 0}
.st-row{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;align-items:start;padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--card);animation:qc-rise var(--d-s) var(--e-in) both}
.st-row.on{border-color:color-mix(in oklch,var(--primary) 45%,var(--border))}
.sec-sep{height:1px;background:var(--border);margin:8px 0}
.opt-tag{font-weight:400;color:var(--muted-fg);font-size:15px}
.ed-tb .sw{position:relative;width:auto;height:auto;min-height:36px;gap:6px;padding:0 8px;font:500 13px 'IBM Plex Sans',sans-serif}
.ed-tb .sw:hover{background:var(--card)}
.info-tip{position:absolute;z-index:5;top:calc(100% + 6px);right:0;width:260px;padding:8px 10px;border-radius:8px;background:var(--fg);color:var(--bg);font:400 12px/1.45 'IBM Plex Sans',sans-serif;white-space:normal;text-align:left;box-shadow:0 4px 12px rgb(0 0 0 / .2);opacity:0;pointer-events:none;translate:0 -4px;transition:opacity var(--d-b) var(--e-std),translate var(--d-b) var(--e-std)}
.sw:hover .info-tip,.sw:focus-visible .info-tip{opacity:1;translate:0 0}
.ro-note{display:flex;gap:6px;align-items:center;margin:0;padding:0 12px 10px;color:var(--primary)}
@container (max-width: 760px){.sw,.ed-tb .sw{min-height:44px}.st-row{grid-template-columns:36px minmax(0,1fr);padding:10px}}
</style>
</helmet>
<div class="{{ rootCls }}">
  <div class="scroller" style="padding-bottom: 120px">
    <div style="max-width: 880px; margin: 0 auto; padding: 20px; display: flex; flex-direction: column; gap: 16px">
      <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 12px">
        <div class="ph-t" style="gap: 2px"><span class="cap">Fórmulas / Editar</span><h1 class="h1">Desengrasante alcalino</h1></div>
        <button class="b b-out b-ico b-touch" type="button" aria-label="Cambiar tema" onClick="{{ toggleDark }}"><span class="theme-ic"><svg class="ic sun" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg><svg class="ic moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path></svg></span></button>
      </div>

      <section class="card" aria-label="Pasos de la fórmula">
        <sc-for list="{{ lists }}" as="L" hint-placeholder-count="3">
          <div style="display: flex; flex-direction: column; gap: 10px">
            <sc-if value="{{ L.sep }}" hint-placeholder-val="{{ false }}"><div class="sec-sep" role="separator"></div></sc-if>
            <div class="card-hd" style="flex-wrap: wrap"><h2 class="h2">{{ L.name }}<sc-if value="{{ L.optional }}" hint-placeholder-val="{{ false }}"> <span class="opt-tag">(opcional)</span></sc-if></h2><span class="cap">{{ L.summary }}</span></div>
            <sc-if value="{{ L.hasHelp }}" hint-placeholder-val="{{ false }}"><p class="help" style="margin: 0">{{ L.help }}</p></sc-if>
            <ol style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px">
              <sc-for list="{{ L.steps }}" as="s" hint-placeholder-count="2">
                <li class="{{ s.rowCls }}">
                  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px"><button class="b b-gho b-ico" type="button" aria-label="{{ s.gripLabel }}" style="cursor: grab"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="stroke-width: 3"><path d="M9 6h.01M15 6h.01M9 12h.01M15 12h.01M9 18h.01M15 18h.01"></path></svg></button><span class="num-dot mono">{{ s.n }}</span></div>
                  <div class="ed" style="min-width: 0">
                    <div class="ed-tb" role="toolbar" aria-label="{{ s.tbLabel }}" style="align-items: center; flex-wrap: wrap">
                      <button type="button" aria-label="Negrilla"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h6a3.5 3.5 0 0 1 0 7H7zM7 12h7a3.5 3.5 0 0 1 0 7H7z"></path></svg></button>
                      <button type="button" aria-label="Cursiva"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 5h8M6 19h8M14 5l-4 14"></path></svg></button>
                      <button type="button" aria-label="Lista de verificación"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 7 2 2 4-4M3 17l2 2 4-4M13 7h8M13 17h8"></path></svg></button>
                      <span style="margin-left: auto; display: inline-flex; align-items: center; gap: 4px; flex-wrap: wrap">
                        <button class="sw" type="button" role="switch" aria-checked="{{ s.evOn }}" aria-label="{{ s.evLabel }}" aria-describedby="{{ s.evTipId }}" onClick="{{ s.toggleEv }}"><span class="sw-t"><i></i></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z"></path></svg><span class="info-tip" role="tooltip" id="{{ s.evTipId }}">{{ s.evTip }}</span></button>
                        <sc-if value="{{ s.canAsg }}" hint-placeholder-val="{{ false }}"><button class="sw" type="button" role="switch" aria-checked="{{ s.asgOn }}" aria-label="{{ s.asgLabel }}" aria-describedby="{{ s.asgTipId }}" onClick="{{ s.toggleAsg }}"><span class="sw-t"><i></i></span><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM19 8v6M22 11h-6"></path></svg><<span class="info-tip" role="tooltip" id="{{ s.asgTipId }}">{{ s.asgTip }}</span></button></sc-if>
                        <button class="b b-gho b-ico b-sm" type="button" aria-label="{{ s.addLabel }}" onClick="{{ s.add }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
                        <button class="b b-gho b-ico b-sm" type="button" aria-label="{{ s.rmLabel }}" onClick="{{ s.remove }}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>
                      </span>
                    </div>
                    <div class="ed-bd" contenteditable="true" role="textbox" aria-multiline="true" aria-label="{{ s.edLabel }}">{{ s.text }}</div>
                    <sc-if value="{{ s.ev }}" hint-placeholder-val="{{ false }}"><p class="cap ro-note enter"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Al ejecutar, este paso pide de 1 a 3 fotos antes de avanzar.</p></sc-if>
                    <sc-if value="{{ s.asg }}" hint-placeholder-val="{{ false }}"><p class="cap ro-note enter"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 5 5 9-10"></path></svg>Al ejecutar, hay que elegir uno o más responsables del equipo antes de avanzar.</p></sc-if>
                  </div>
                </li>
              </sc-for>
            </ol>
          </div>
        </sc-for>
      </section>
    </div>
  </div>
  <footer class="op-ft">
    <div style="max-width: 880px; margin: 0 auto; padding: 0 20px; display: flex; justify-content: flex-end; gap: 12px; flex-wrap: wrap">
      <button class="b b-out b-touch" type="button">Cancelar</button>
      <button class="b b-out b-touch" type="button">Guardar y salir</button>
      <button class="b b-pri b-touch" type="button">Guardar</button>
    </div>
  </footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"oscuro":{"editor":"boolean","default":false},"vacio":{"editor":"boolean","default":false},"$preview":{"width":1440,"height":1400}}'>
class Component extends DCLogic {
renderVals() {
const s = this.state || {};
const dark = s.dark !== undefined ? s.dark : !!this.props.oscuro;
const init = {
fab: [['Prepara la mezcladora: revisa que esté limpia y seca.', true, false], ['Agrega el 60 % del agua y enciende la agitación.', false, false], ['Mide el pH y anótalo en la etiqueta.', true, false]],
env: [['Llena las garrafas hasta la marca de 20 L.', true, false], ['Pega la etiqueta del lote.', false, false]],
aco: this.props.vacio ? [['', false, false]] : [['Revisa que cada garrafa esté sellada y sin fugas.', false, false], ['Etiqueta cada garrafa con el lote y la fecha de vencimiento.', true, true], ['Arma las cajas de despacho: 4 garrafas por caja.', false, true], ['Verifica el conteo final contra el pedido.', false, false]]
};
const data = s.data || init;
const set = (key, arr) => this.setState({ data: Object.assign({}, data, { [key]: arr }) });
const mk = (key, name, sep, optional, help, canAsg) => {
const arr = data[key];
const ev = arr.filter((x) => x[1]).length;
const asg = arr.filter((x) => x[2]).length;
const parts = [];
if (ev) parts.push(ev + (ev === 1 ? ' pide evidencia' : ' piden evidencia'));
if (canAsg && asg) parts.push(asg + (asg === 1 ? ' pide responsables' : ' piden responsables'));
return {
name: name, sep: sep, optional: optional, hasHelp: !!help, help: help,
summary: arr.length + (arr.length === 1 ? ' paso' : ' pasos') + (parts.length ? ' · ' + parts.join(' · ') : ''),
steps: arr.map((x, j) => ({
n: j + 1, text: x[0], ev: x[1], asg: canAsg && x[2], canAsg: canAsg,
evOn: x[1] ? 'true' : 'false', asgOn: x[2] ? 'true' : 'false',
rowCls: (x[1] || (canAsg && x[2])) ? 'st-row on' : 'st-row',
tbLabel: 'Formato del paso ' + (j + 1) + ' de ' + name,
evLabel: 'Requiere evidencia en el paso ' + (j + 1) + ' de ' + name,
asgLabel: 'Asignación requerida en el paso ' + (j + 1) + ' de ' + name,
evTipId: 'tip-ev-' + key + '-' + j,
asgTipId: 'tip-asg-' + key + '-' + j,
evTip: 'Requiere evidencia: al ejecutar, el paso pide de 1 a 3 fotos antes de avanzar.',
asgTip: 'Asignación requerida: al ejecutar, hay que elegir uno o más responsables del equipo que hicieron el paso.',
gripLabel: 'Mover el paso ' + (j + 1) + ' de ' + name,
addLabel: 'Añadir un paso después del ' + (j + 1) + ' en ' + name,
rmLabel: 'Quitar el paso ' + (j + 1) + ' de ' + name,
edLabel: 'Texto del paso ' + (j + 1) + ' de ' + name,
toggleEv: () => set(key, arr.map((y, m) => m === j ? [y[0], !y[1], y[2]] : y)),
toggleAsg: () => set(key, arr.map((y, m) => m === j ? [y[0], y[1], !y[2]] : y)),
add: () => set(key, arr.slice(0, j + 1).concat([['', false, false]], arr.slice(j + 1))),
remove: () => set(key, arr.length > 1 ? arr.filter((y, m) => m !== j) : [['', false, false]])
}))
};
};
return {
rootCls: dark ? 'qc app dk' : 'qc app',
toggleDark: () => this.setState({ dark: !dark }),
lists: [
mk('fab', 'Pasos', false, false, '', false),
mk('env', 'Envasado', true, true, 'Opcional. Pasos que sigue el empacador uno a uno al empacar el pedido.', false),
mk('aco', 'Acondicionamiento', true, true, 'Opcional. Pasos que sigue el acondicionador uno a uno al acondicionar el pedido. «Asignación requerida» le pide elegir quién del equipo hizo el paso.', true)
]
};
}
}
</script>
</body>
</html>
