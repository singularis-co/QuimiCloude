<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Contactos · móvil, lista</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F6B66}a:hover{color:#164E4A}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #1F2426; background: #FFFFFF; overflow: hidden">
  <header style="display: flex; align-items: center; gap: 8px; padding: 10px 12px; background: #133638; color: #EEF5F5">
    <button type="button" aria-label="Abrir menú" style="width: 44px; height: 44px; border: 0; background: transparent; color: inherit; display: flex; align-items: center; justify-content: center">
      <svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"></path></svg>
    </button>
    <h1 style="margin: 0; font-size: 18px; font-weight: 600">Contactos</h1>
  </header>
  <div style="padding: 12px; border-bottom: 1px solid #E3E8EA">
    <label for="buscar-m" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Buscar conversación</label>
    <div style="display: flex; align-items: center; gap: 8px; border: 1px solid #DCE2E4; border-radius: 6px; padding: 0 10px; height: 44px">
      <svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#5E6668" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <input id="buscar-m" type="search" placeholder="Buscar por nombre o teléfono" style="border: 0; outline: none; flex: 1; font: inherit; font-size: 15px; background: transparent">
    </div>
  </div>
  <div style="flex: 1; overflow: hidden; display: flex; flex-direction: column">
    <sc-for list="{{conversaciones}}" as="c" hint-placeholder-count="8">
      <a href="ContactosChatMovil.dc.html" style="display: flex; gap: 12px; padding: 12px; border-bottom: 1px solid #EEF1F2; text-decoration: none; color: #1F2426">
        <div aria-hidden="true" style="width: 44px; height: 44px; border-radius: 50%; background: #E9F0FB; color: #284C86; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; flex-shrink: 0">{{c.iniciales}}</div>
        <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px">
          <div style="display: flex; justify-content: space-between; gap: 8px; align-items: baseline">
            <span style="font-weight: 600; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.nombre}}</span>
            <span style="font-size: 12px; color: {{c.colorHora}}; flex-shrink: 0">{{c.hora}}</span>
          </div>
          <span style="font-size: 12px; color: #5E6668; font-family: 'IBM Plex Mono', monospace">{{c.telefono}}</span>
          <div style="display: flex; justify-content: space-between; gap: 8px; align-items: center">
            <span style="font-size: 14px; color: #4A5254; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{c.preview}}</span>
            <sc-if value="{{c.tieneNoLeidos}}" hint-placeholder-val="{{ true }}">
              <span aria-label="{{c.noLeidosLabel}}" style="min-width: 20px; height: 20px; border-radius: 10px; background: #1F6B66; color: #FFFFFF; font-size: 11px; font-weight: 600; display: flex; align-items: center; justify-content: center; padding: 0 6px; box-sizing: border-box">{{c.noLeidos}}</span>
            </sc-if>
          </div>
        </div>
      </a>
    </sc-for>
    <div role="status" style="display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; font-size: 13px; color: #4A5254">
      <svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12a9 9 0 1 1-3-6.7"></path><path d="M21 4v5h-5"></path></svg>
      Cargando más conversaciones…
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const base = [
      { iniciales: 'LA', nombre: 'Laboratorios Andinos', telefono: '+593 99 812 4471', preview: 'Perfecto, ¿me confirman el despacho?', hora: '10:44', noLeidos: 3 },
      { iniciales: 'DR', nombre: 'Distribuidora El Roble', telefono: '+593 98 455 2107', preview: '¿Se lo envío en PDF?', hora: '10:42', noLeidos: 0 },
      { iniciales: 'FS', nombre: 'Farmacia San Blas', telefono: '+593 96 230 8814', preview: '[Audio]', hora: '09:58', noLeidos: 1 },
      { iniciales: 'HM', nombre: 'Hotel Mirador', telefono: '+593 99 671 0032', preview: 'Gracias, quedo atento.', hora: 'Ayer', noLeidos: 0 },
      { iniciales: 'CQ', nombre: 'Clínica Quitumbe', telefono: '+593 97 118 5590', preview: 'Sistema: Su pedido fue despachado.', hora: 'Ayer', noLeidos: 0 },
      { iniciales: 'LP', nombre: 'Lavandería La Pradera', telefono: '+593 98 902 3361', preview: '[Imagen] Foto del bidón', hora: 'Lun', noLeidos: 0 },
      { iniciales: 'TV', nombre: 'Taller Vásconez', telefono: '+593 99 340 7718', preview: 'Mensaje no soportado', hora: '12/10', noLeidos: 0 },
      { iniciales: 'PG', nombre: 'Panadería Guápulo', telefono: '+593 96 554 0187', preview: 'Sistema: Su pedido fue registrado.', hora: '10/10', noLeidos: 0 }
    ];
    return {
      conversaciones: base.map((c) => ({
        ...c,
        tieneNoLeidos: c.noLeidos > 0,
        noLeidosLabel: c.noLeidos + ' sin leer',
        colorHora: c.noLeidos > 0 ? '#1F6B66' : '#5E6668'
      }))
    };
  }
}
</script>
</body>
</html>
