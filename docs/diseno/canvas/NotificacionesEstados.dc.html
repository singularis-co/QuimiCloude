<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Estados de notificaciones</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="./qc.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div class="qc" style="width: 2500px; height: 3820px; box-sizing: border-box; padding: 40px; display: flex; flex-direction: column; gap: 24px">
  <div class="ph-t"><h1 class="h1">Notificaciones · estados (QC-137)</h1><p class="sub">Cada caja es una pantalla privada a 780 px con el panel de la campana. No hay página de notificaciones: todo vive en el panel.</p></div>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px 40px">
    <sc-for list="{{ states }}" as="e" hint-placeholder-count="11">
      <div style="display: flex; flex-direction: column; gap: 10px">
        <div style="display: flex; flex-direction: column; gap: 2px"><span class="h3">{{ e.t }}</span><span class="cap">{{ e.d }}</span></div>
        <div style="position: relative; width: 780px; height: 820px; border-radius: 14px; border: 1px solid var(--border); overflow: hidden"><div class="frame-in"><dc-import name="Notificaciones" estado="{{ e.k }}" panel="{{ e.p }}" cola="{{ e.c }}" sinaudio="{{ e.a }}" nuevo="{{ e.n }}" oscuro="{{ e.o }}" hint-size="100%,100%"></dc-import></div></div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2500,"height":3820}}'>
class Component extends DCLogic {
renderVals() {
const st = (k, t, d, p, a, n, o, c) => ({ k: k, t: t, d: d, p: !!p, a: !!a, n: !!n, o: !!o, c: c || 'normal' });
return { states: [
st('lista', '1 · Panel con avisos', '3 sin leer: fondo tintado, título en negrita y punto. El conteo de la campana es el mismo número.', true),
st('lista', '2 · Panel cerrado', 'Solo la campana con su conteo en la cabecera.', false),
st('lista', '3 · Llega un aviso nuevo', 'La campana se balancea, el conteo pulsa y la fila entra desde arriba. Suena el tono una vez por navegador.', true, false, true),
st('lista', '4 · Navegador sin audio', 'Toast informativo una vez por sesión. Los avisos siguen llegando; no hay botón de silenciar.', false, true, true),
st('lista', '5 · Cargando más al hacer scroll', 'Al acercarse al final de la lista se piden los siguientes avisos solos.', true, false, false, false, 'cargandomas'),
st('lista', '6 · Falla la carga de más', 'Mensaje al final con «Reintentar»; la lista ya cargada se queda.', true, false, false, false, 'errormas'),
st('lista', '7 · Fin de la lista', 'Ya no hay más: «No hay más avisos. Se conservan 90 días.»', true, false, false, false, 'fin'),
st('vacio', '8 · Sin avisos', 'Conteo 0: la campana no lleva insignia y el panel muestra el vacío.', true),
st('cargando', '9 · Cargando', 'Esqueletos en el panel mientras llegan los avisos.', true),
st('error', '10 · Error', 'No se pudieron cargar. «Reintentar» vuelve a pedirlos.', true),
st('lista', '11 · Modo oscuro', 'Panel en oscuro.', true, false, false, true)
] };
}
}
</script>
</body>
</html>
